[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-skill-pool"
version = "0.1.0"
description = "Standalone self-evolving skill pool extracted from Paper-Agent"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
rsi-skill-pool = "backend.app.skills.__main__:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests/skill_pool"]

[tool.ruff]
line-length = 100
target-version = "py311"
